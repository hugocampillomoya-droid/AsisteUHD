<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>AsisteUHD</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icon1.png">

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.3.0/tabler-icons.min.css" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue-50:  #E6F1FB; --blue-500: #185FA5; --blue-700: #0C447C;
      --gray-50:  #F7F8FA; --gray-100: #EEF0F4; --gray-400: #9BA3B2; --gray-800: #2C3142;
      --white: #FFFFFF;
      --radius-lg: 18px;
      --font: 'DM Sans', sans-serif;
    }

    /* FIX: Ahora el cuerpo ocupa toda la pantalla del móvil, sin márgenes de simulador */
    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: var(--font);
      background: var(--gray-50);
      position: fixed; /* Evita rebote en iOS */
    }

    #phone {
      width: 100%;
      height: 100%;
      background: var(--gray-50);
      display: flex;
      flex-direction: column;
      /* Ajuste para el notch de los móviles modernos */
      padding-top: env(safe-area-inset-top); 
    }

    /* Pantallas */
    .screen { display: none; flex-direction: column; flex: 1; overflow: hidden; }
    .screen.active { display: flex; }
    .screen-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }

    /* Cabeceras */
    .home-header { background: var(--white); padding: 20px; border-bottom: 1px solid var(--gray-100); }
    .logo-row { display: flex; align-items: center; gap: 12px; }
    .logo-icon { width: 40px; height: 40px; border-radius: 12px; background: var(--blue-500); display: flex; align-items: center; justify-content: center; color: white; font-size: 20px; }
    .logo-name { font-size: 18px; font-weight: 600; }

    /* Tarjetas principales - Adaptadas a ancho completo móvil */
    .main-card {
      display: flex; align-items: center; gap: 15px; padding: 18px;
      background: var(--white); border-radius: var(--radius-lg);
      border: 1px solid var(--gray-100); margin: 0 16px 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
      cursor: pointer;
    }
    .card-icon { width: 50px; height: 50px; border-radius: 15px; display: flex; align-items: center; justify-content: center; font-size: 24px; }
    .icon-blue { background: var(--blue-50); color: var(--blue-500); }
    .icon-green { background: #EAF3DE; color: #3B6D11; }
    .icon-purple { background: #EEEDFE; color: #534AB7; }
    .card-body { flex: 1; }
    .card-title { font-weight: 600; color: var(--gray-800); }
    .card-sub { font-size: 12px; color: var(--gray-400); }

    /* Nav Bar - Estilo App Nativa */
    .nav-bar {
      background: var(--white);
      border-top: 1px solid var(--gray-100);
      display: flex;
      justify-content: space-around;
      padding: 10px 0 calc(15px + env(safe-area-inset-bottom)); /* Margen inferior iPhone */
    }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--gray-400); font-size: 11px; text-decoration: none; }
    .nav-item.active { color: var(--blue-500); }
    .nav-item i { font-size: 24px; }

    /* Inner headers para sub-pantallas */
    .inner-header { background: var(--white); padding: 15px 20px; display: flex; align-items: center; gap: 15px; border-bottom: 1px solid var(--gray-100); }
    .back-btn { background: var(--gray-100); border: none; padding: 8px; border-radius: 10px; cursor: pointer; }
  </style>
</head>
<body>

<div id="phone">
  
  <div id="screen-home" class="screen active">
    <div class="home-header">
      <div class="logo-row">
        <div class="logo-icon"><i class="ti ti-activity-heartbeat"></i></div>
        <div>
          <div class="logo-name">AsisteUHD</div>
          <div style="font-size: 11px; color: var(--gray-400);">Hospitalización Domiciliaria</div>
        </div>
      </div>
    </div>

    <div class="screen-body">
      <div style="padding: 20px 18px 10px; font-size: 12px; font-weight: 600; color: var(--gray-400); text-transform: uppercase;">Servicios</div>
      
      <div class="main-card" onclick="showScreen('screen-route')">
        <div class="card-icon icon-blue"><i class="ti ti-map-pin"></i></div>
        <div class="card-body">
          <div class="card-title">Ruta Diaria</div>
          <div class="card-sub">Ver mapa de pacientes</div>
        </div>
        <i class="ti ti-chevron-right" style="color: var(--gray-200);"></i>
      </div>

      <div class="main-card" onclick="showScreen('screen-curas')">
        <div class="card-icon icon-green"><i class="ti ti-bandage"></i></div>
        <div class="card-body">
          <div class="card-title">Curas IA</div>
          <div class="card-sub">Análisis de heridas</div>
        </div>
        <i class="ti ti-chevron-right" style="color: var(--gray-200);"></i>
      </div>

      <div class="main-card">
        <div class="card-icon icon-purple"><i class="ti ti-microphone"></i></div>
        <div class="card-body">
          <div class="card-title">Evolutivo Voz</div>
          <div class="card-sub">Transcripción IA activa</div>
        </div>
        <i class="ti ti-chevron-right" style="color: var(--gray-200);"></i>
      </div>
    </div>
  </div>

  <div id="screen-route" class="screen">
    <div class="inner-header">
      <button class="back-btn" onclick="showScreen('screen-home')"><i class="ti ti-arrow-left"></i></button>
      <div style="font-weight: 600;">Mi Ruta Diaria</div>
    </div>
    <div class="screen-body">
      <div style="height: 200px; background: #e8eedd; margin: 15px; border-radius: 15px; display: flex; align-items: center; justify-content: center; color: #639922; border: 1px dashed;">Mapa cargando...</div>
    </div>
  </div>

  <div id="screen-curas" class="screen">
    <div class="inner-header">
      <button class="back-btn" onclick="showScreen('screen-home')"><i class="ti ti-arrow-left"></i></button>
      <div style="font-weight: 600;">Curas IA</div>
    </div>
    <div class="screen-body" style="padding: 20px; text-align: center;">
      <i class="ti ti-camera" style="font-size: 50px; color: var(--gray-400);"></i>
      <p style="margin-top: 10px; color: var(--gray-600);">Cámara de análisis lista</p>
    </div>
  </div>

  <nav class="nav-bar">
    <div class="nav-item" onclick="showScreen('screen-route')"><i class="ti ti-calendar-stats"></i><span>Agenda</span></div>
    <div class="nav-item active" onclick="showScreen('screen-home')"><i class="ti ti-smart-home"></i><span>Inicio</span></div>
    <div class="nav-item"><i class="ti ti-user-circle"></i><span>Perfil</span></div>
  </nav>

</div>

<script>
  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    
    // Cambiar estado activo de la barra
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    if(id === 'screen-home') document.querySelectorAll('.nav-item')[1].classList.add('active');
  }
</script>
</body>
</html>
