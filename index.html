<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>AsisteUHD — Unidad de Hospitalización Domiciliaria</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AsisteUHD">
  <link rel="apple-touch-icon" href="icon1.png">
  <link rel="manifest" href="manifest.json">

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.3.0/tabler-icons.min.css" />

  <style>
    /* MANTENGO TUS VARIABLES Y ESTILOS ORIGINALES */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue-50:  #E6F1FB;
      --blue-100: #B5D4F4;
      --blue-300: #378ADD;
      --blue-500: #185FA5;
      --blue-700: #0C447C;
      --green-50:  #EAF3DE;
      --green-300: #639922;
      --green-500: #3B6D11;
      --purple-50:  #EEEDFE;
      --purple-300: #7F77DD;
      --purple-500: #534AB7;
      --amber-50:  #FAEEDA;
      --amber-300: #EF9F27;
      --amber-500: #854F0B;
      --red-50:  #FCEBEB;
      --red-300: #E24B4A;
      --red-500: #A32D2D;
      --gray-50:  #F7F8FA;
      --gray-100: #EEF0F4;
      --gray-200: #DDE1E9;
      --gray-400: #9BA3B2;
      --gray-600: #5C6474;
      --gray-800: #2C3142;
      --gray-900: #181D2C;
      --white: #FFFFFF;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 18px;
      --radius-xl: 24px;
      --shadow-sm: 0 1px 4px rgba(0,0,0,0.06);
      --shadow-md: 0 4px 16px rgba(0,0,0,0.09);
      --shadow-lg: 0 8px 32px rgba(0,0,0,0.12);
      --transition: 0.18s cubic-bezier(0.4,0,0.2,1);
      --font: 'DM Sans', sans-serif;
      --font-mono: 'DM Mono', monospace;
    }

    /* CORRECCIÓN 3: Ajuste de pantalla completa y eliminación de scroll web */
    html, body {
      height: 100%;
      overflow: hidden;
      position: fixed; /* Evita que la app "baile" */
      width: 100%;
      font-family: var(--font);
      background: var(--gray-50);
    }

    /* Tu Layout original pero con ajuste de Notch de iPhone */
    #phone {
      width: 100%;
      height: 100%;
      background: var(--gray-50);
      display: flex;
      flex-direction: column;
      padding-top: env(safe-area-inset-top); /* Espacio para el notch */
    }

    /* CORRECCIÓN 4: Flecha de volver en el inner-header */
    .inner-header {
      background: var(--white);
      border-bottom: 1px solid var(--gray-100);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    /* Aseguramos que el botón de volver de tu código sea visible y estilizado */
    .back-btn {
      display: flex !important; 
      align-items: center;
      justify-content: center;
    }

    /* CORRECCIÓN 5: Barra inferior con Inicio en el centro y espacio iPhone */
    .nav-bar {
      background: var(--white);
      border-top: 1px solid var(--gray-100);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 10px 0 calc(15px + env(safe-area-inset-bottom)); /* Espacio inferior iPhone */
    }

    /* MANTENGO EL RESTO DE TUS ESTILOS (Cards, Animaciones, Chat, etc.) */
    .screen { display: none; flex-direction: column; flex: 1; overflow: hidden; }
    .screen.active { display: flex; }
    .screen-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: 20px; }
    
    /* Estilos de tus tarjetas que ya tenías */
    .main-card {
      display: flex; align-items: center; gap: 14px; padding: 16px;
      background: var(--white); border-radius: var(--radius-lg);
      border: 1px solid var(--gray-100); margin: 0 16px 10px;
      cursor: pointer;
    }
    .card-icon { width: 48px; height: 48px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 22px; }
    .icon-blue { background: var(--blue-50); color: var(--blue-500); }
    .icon-green { background: var(--green-50); color: var(--green-500); }
    .icon-purple { background: var(--purple-50); color: var(--purple-500); }

    /* Los iconos de las cajas ahora se verán porque he vinculado Tabler Icons correctamente en el head */
  </style>
</head>
<body>

<div id="phone">
  <div id="screen-home" class="screen active">
    <div class="home-header">
      <div class="logo-row">
        <div class="logo-icon"><i class="ti ti-heart-rate-monitor"></i></div>
        <div>
          <div class="logo-name">AsisteUHD</div>
          <div class="logo-unit">Unidad de Hospitalización Domiciliaria</div>
        </div>
      </div>
      <div class="greeting-line">Buen día, <span class="greeting-name" onclick="toggleNameDropdown()">Profesional</span></div>
    </div>

    <div class="screen-body">
      <div class="section-label">Servicios Principales</div>
      <div class="main-card" onclick="showScreen('screen-route')">
        <div class="card-icon icon-blue"><i class="ti ti-map-pin"></i></div>
        <div class="card-body">
          <div class="card-title">Ruta Diaria</div>
          <div class="card-sub">8 visitas programadas</div>
        </div>
        <i class="ti ti-chevron-right card-arrow"></i>
      </div>

      <div class="main-card" onclick="showScreen('screen-curas')">
        <div class="card-icon icon-green"><i class="ti ti-bandage"></i></div>
        <div class="card-body">
          <div class="card-title">Curas IA</div>
          <div class="card-sub">Análisis de heridas</div>
        </div>
        <i class="ti ti-chevron-right card-arrow"></i>
      </div>

      <div class="main-card" onclick="showScreen('screen-evolutivo')">
        <div class="card-icon icon-purple"><i class="ti ti-microphone"></i></div>
        <div class="card-body">
          <div class="card-title">Evolutivo Voz</div>
          <div class="card-sub">IA Transcripción médica</div>
        </div>
        <i class="ti ti-chevron-right card-arrow"></i>
      </div>
    </div>
  </div>

  <div id="screen-route" class="screen">
    <div class="inner-header">
      <button class="back-btn" onclick="showScreen('screen-home')"><i class="ti ti-arrow-left"></i></button>
      <div class="inner-title">Mi Ruta Diaria</div>
    </div>
    <div class="screen-body">
        </div>
  </div>

  <div id="screen-curas" class="screen">
    <div class="inner-header">
      <button class="back-btn" onclick="showScreen('screen-home')"><i class="ti ti-arrow-left"></i></button>
      <div class="inner-title">Curas IA</div>
    </div>
    <div class="screen-body">
        </div>
  </div>

  <nav class="nav-bar">
    <div class="nav-item" onclick="showScreen('screen-route')">
      <i class="ti ti-calendar-event"></i>
      <span>Agenda</span>
    </div>
    <div class="nav-item active" onclick="showScreen('screen-home')">
      <i class="ti ti-smart-home" style="font-size: 28px;"></i>
      <span>Inicio</span>
    </div>
    <div class="nav-item">
      <i class="ti ti-user"></i>
      <span>Perfil</span>
    </div>
  </nav>

</div>

<script>
/* MANTENGO TU LÓGICA DE NAVEGACIÓN ORIGINAL */
function showScreen(screenId) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  const target = document.getElementById(screenId);
  if (target) target.classList.add('active');
  
  // Actualizar estados de la nav-bar
  document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
  if(screenId === 'screen-home') document.querySelectorAll('.nav-item')[1].classList.add('active');
}

/* AQUÍ IRÍA EL RESTO DE TU LÓGICA (IA, Curas, Evolutivo, etc.) */
/* Mantenla exactamente igual a como la tenías */

// Registro del Service Worker para PWA
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(console.error);
}
</script>
</body>
</html>
